<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Eyongtarh Besong | Full Stack Software Developer</title>
    <meta
      name="description"
      content="Portfolio of Eyongtarh Besong, a Full Stack Software Developer in Gothenburg specialising in React, Django, Python, PostgreSQL and modern web applications."
    />
    <meta name="author" content="Eyongtarh Besong" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://eyongtarh.com/" />

    <!-- Icons and manifest -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Start downloading the Latin font file straight away, in parallel with the CSS
         that references it. Vite rewrites this path to the same hashed file the CSS uses,
         so it is downloaded once. "crossorigin" is required for font preloads. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Start downloading the hero portrait straight away -->
    <link rel="preload" as="image" href="/profile.webp" type="image/webp" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="Eyongtarh Besong" />
    <meta property="og:url" content="https://eyongtarh.com/" />
    <meta property="og:title" content="Eyongtarh Besong | Full Stack Software Developer" />
    <meta
      property="og:description"
      content="Projects, skills and experience in React, Django, Python and PostgreSQL."
    />
    <meta property="og:image" content="https://eyongtarh.com/og-image.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eyongtarh Besong, Full Stack Software Developer" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eyongtarh Besong | Full Stack Software Developer" />
    <meta
      name="twitter:description"
      content="Projects, skills and experience in React, Django, Python and PostgreSQL."
    />
    <meta name="twitter:image" content="https://eyongtarh.com/og-image.webp" />
    <meta name="twitter:image:alt" content="Eyongtarh Besong, Full Stack Software Developer" />

    <!-- Structured data. Data blocks like this are not executed, so the CSP allows them. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://eyongtarh.com/#person",
            "name": "Augustine Eyongtarh Besong",
            "alternateName": ["Eyongtarh Besong", "A. Eyongtarh Besong"],
            "jobTitle": "Full Stack Software Developer",
            "url": "https://eyongtarh.com/",
            "image": "https://eyongtarh.com/profile.webp",
            "email": "mailto:eyongtarhb@gmail.com",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Gothenburg",
              "addressCountry": "SE"
            },
            "alumniOf": [
              { "@type": "CollegeOrUniversity", "name": "University of Gothenburg" },
              { "@type": "CollegeOrUniversity", "name": "University of Buea" },
              { "@type": "EducationalOrganization", "name": "Code Institute" }
            ],
            "knowsAbout": [
              "React",
              "Django",
              "Python",
              "JavaScript",
              "PostgreSQL",
              "REST APIs",
              "Full Stack Development",
              "Economics"
            ],
            "sameAs": [
              "https://github.com/Eyongtarh",
              "https://www.linkedin.com/in/a-eyongtarh-besong-22ab9b281/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://eyongtarh.com/#website",
            "url": "https://eyongtarh.com/",
            "name": "Eyongtarh Besong",
            "inLanguage": "en-GB",
            "publisher": { "@id": "https://eyongtarh.com/#person" }
          }
        ]
      }
    </script>
  </head>

</html>
